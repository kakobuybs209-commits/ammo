<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ITEMFINDER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            background: rgba(12, 12, 12, 0.95);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .brand-logo b {
            font-weight: 400;
            color: #737373;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .login-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #e5e5e5;
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        @media (max-width: 480px) {
            .login-container { padding: 36px 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-logo">ITEM<b>FINDER</b></div>
        <h1>Admin Panel</h1>
        <p class="subtitle">Zaloguj się, aby zarządzać portalem</p>

        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@itemfinder.pl" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="login-btn">Zaloguj się</button>
        </form>

        <div class="message" id="msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://qgzmpjbdwwlmhtsrnbaj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnem1wamJkd3dsbWh0c3JuYmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDA1NjMsImV4cCI6MjEwNTk3NjU2M30.v87uKHb7zYlTyPfw7jBpgwiF4vUgRiwSxpgkI7f4uGU';

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const msg = document.getElementById('msg');

        function showMsg(text, type) {
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Logowanie...';
            msg.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });

                if (error) {
                    console.error('Supabase auth error:', error);
                    showMsg(error.message || 'Błędny email lub hasło.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Zaloguj się';
                    return;
                }

                // Zapisz sesję
                sessionStorage.setItem('admin_authenticated', 'true');
                sessionStorage.setItem('admin_user', JSON.stringify({
                    email: data.user.email,
                    id: data.user.id
                }));

                showMsg('Zalogowano! Przekierowywanie...', 'success');

                setTimeout(() => {
                    window.location.href = '/index.html?admin=true';
                }, 1000);

            } catch (err) {
                showMsg('Błąd połączenia. Spróbuj ponownie.', 'error');
                btn.disabled = false;
                btn.textContent = 'Zaloguj się';
            }
        });
    </script>
</body>
</html>
